services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verirag-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SENTINEL_HOSTS: "sentinel-1:26379,sentinel-2:26379,sentinel-3:26379"
      REDIS_SERVICE_NAME: "auditflow-redis"
    depends_on:
      redis-primary:
        condition: service_healthy
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started
    networks:
      - verirag-network


  redis-primary:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - verirag-network

  redis-replica-1:
    image: redis:7-alpine
    command: redis-server --replicaof redis-primary 6379
    depends_on:
      redis-primary:
        condition: service_healthy
    networks:
      - verirag-network

  redis-replica-2:
    image: redis:7-alpine
    command: redis-server --replicaof redis-primary 6379
    depends_on:
      redis-primary:
        condition: service_healthy
    networks:
      - verirag-network

  sentinel-1:
    image: redis:7-alpine
    command: redis-sentinel /etc/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - "./sentinel.conf:/etc/sentinel.conf"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-primary:
        condition: service_healthy
    networks:
      - verirag-network

  sentinel-2:
    image: redis:7-alpine
    command: redis-sentinel /etc/sentinel.conf
    ports:
      - "26380:26379"
    volumes:
      - "./sentinel.conf:/etc/sentinel.conf"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-primary:
        condition: service_healthy
    networks:
      - verirag-network

  sentinel-3:
    image: redis:7-alpine
    command: redis-sentinel /etc/sentinel.conf
    ports:
      - "26381:26379"
    volumes:
      - "./sentinel.conf:/etc/sentinel.conf"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-primary:
        condition: service_healthy
    networks:
      - verirag-network
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

  redis-exporter:
    image: oliver006/redis_exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports: ["9121:9121"]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://user:pass@postgres:5432/auditflow?sslmode=disable
    ports: ["9187:9187"]

volumes:
  grafana-data:

networks:
  verirag-network:
    driver: bridge