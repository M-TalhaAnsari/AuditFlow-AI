global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auditflow-backend
    static_configs:
      - targets: ["backend:8000"]   # scrapes /metrics from Step 1+2
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]